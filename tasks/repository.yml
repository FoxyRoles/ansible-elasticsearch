---

- name: Ensure repository dependencies are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present

- name: Remove the legacy Elasticsearch repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/elasticsearch.list
    state: absent
  register: elasticsearch_legacy_repository

- name: Configure the Elasticsearch APT repository
  ansible.builtin.deb822_repository:
    name: elasticsearch
    types: deb
    uris: "https://artifacts.elastic.co/packages/{{ elasticsearch_version }}/apt"
    suites: stable
    components: main
    signed_by: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present
  register: elasticsearch_repository

- name: Refresh the APT cache after repository changes
  ansible.builtin.apt:
    update_cache: true
  when: elasticsearch_repository is changed or elasticsearch_legacy_repository is changed
